spring:
  application:
    name: rag
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  # 1. Spring Data Connexion JDBC/JPA (Linux Postgres)
  datasource:
#    url: jdbc:postgresql://192.168.1.202:5432/ragdb
    url: jdbc:postgresql://100.77.221.102:5432/ragdb # tailscale
    username: raguser
    password: ragpassword
    driver-class-name: org.postgresql.Driver

  # 2. Disabled local Docker Compose (Mac)
  docker:
    compose:
      enabled: false

  # 3. Spring AI config (Ollama + PGVector)
  ai:
    ollama:
#      base-url: http://192.168.1.202:11434
      base-url: http://100.77.221.102:11434 # tailscale
      chat:
        options:
          model: qwen2.5:0.5b
          temperature: 0.2
          num-ctx: 4096
      embedding:
        options:
          model: nomic-embed-text # 768 dimensions

    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768 # MUST match witch 'nomic-embed-text'
        initialize-schema: true