spring:
  application:
    name: rag
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  # 1. Spring Data Connexion JDBC/JPA (Linux Postgres)
  datasource:
    url: jdbc:postgresql://localhost:5432/ragdb
    username: raguser
    password: ragpassword
    driver-class-name: org.postgresql.Driver

  # 2. Disabled local Docker Compose (Mac)
  docker:
    compose:
      enabled: false

  # 3. Spring AI config (Ollama + PGVector)
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2:3b
          temperature: 0.2
          num-ctx: 4096
      embedding:
        options:
          model: nomic-embed-text # 768 dimensions

    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768 # MUST match witch 'nomic-embed-text'
        initialize-schema: true